<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eef8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#1e3a5f" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M2 2 L10 6 L2 10 Z" fill="#2b83d3"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 58px; font-weight: 800; fill: #0f2d4a; }
      .subtitle { font-size: 24px; fill: #61768b; }
      .box-title { font-size: 29px; font-weight: 760; fill: #102d48; }
      .box-text { font-size: 21px; fill: #5d7184; }
      .small-title { font-size: 25px; font-weight: 740; fill: #102d48; }
      .small-text { font-size: 19px; fill: #5d7184; }
      .section { font-size: 31px; font-weight: 780; fill: #102d48; }
      .arrow { stroke: #2b83d3; stroke-width: 6; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .label { font-size: 19px; font-weight: 650; fill: #1d6fb8; }
    </style>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <g opacity=".45" stroke="#c8ddeb" stroke-width="1.4">
    <path d="M60 70 L170 120 L250 40"/>
    <path d="M1290 55 L1395 130 L1490 45"/>
    <path d="M40 920 L170 820 L300 900"/>
    <path d="M1230 880 L1380 820 L1500 910"/>
    <circle cx="170" cy="120" r="7" fill="#53d280" stroke="none"/>
    <circle cx="1395" cy="130" r="7" fill="#9bcdec" stroke="none"/>
  </g>

  <text x="768" y="86" text-anchor="middle" class="title">GateWayVPN 系统实现原理</text>
  <text x="768" y="132" text-anchor="middle" class="subtitle">把免费 VPNGate 节点变成 VPS 上的本地 HTTP/SOCKS5 代理网关</text>

  <g transform="translate(70 285)" filter="url(#shadow)">
    <rect width="215" height="178" rx="18" fill="#e8f4ff" stroke="#2b83d3" stroke-width="3"/>
    <text x="107.5" y="60" text-anchor="middle" font-size="46">💻</text>
    <text x="107.5" y="105" text-anchor="middle" class="box-title">用户应用</text>
    <text x="107.5" y="138" text-anchor="middle" class="box-text">浏览器 / 脚本</text>
    <text x="107.5" y="166" text-anchor="middle" class="box-text">把流量发到代理</text>
  </g>

  <path class="arrow" d="M295 374 H370"/>
  <g transform="translate(370 285)" filter="url(#shadow)">
    <rect width="238" height="178" rx="18" fill="#e9fbf5" stroke="#13a37f" stroke-width="3"/>
    <text x="119" y="60" text-anchor="middle" font-size="46">⚙️</text>
    <text x="119" y="105" text-anchor="middle" class="box-title">GateWayVPN 网关</text>
    <text x="119" y="138" text-anchor="middle" class="box-text">运行在 VPS</text>
    <text x="119" y="166" text-anchor="middle" class="box-text">Web 管理 + 后台守护</text>
  </g>

  <path class="arrow" d="M618 374 H690"/>
  <g transform="translate(690 285)" filter="url(#shadow)">
    <rect width="248" height="178" rx="18" fill="#f5faff" stroke="#2b83d3" stroke-width="3"/>
    <text x="124" y="60" text-anchor="middle" font-size="46">🔌</text>
    <text x="124" y="105" text-anchor="middle" class="box-title">本地代理端口</text>
    <text x="124" y="138" text-anchor="middle" class="box-text">HTTP / SOCKS5</text>
    <text x="124" y="166" text-anchor="middle" class="box-text">默认 127.0.0.1:7928</text>
  </g>

  <path class="arrow" d="M948 374 H1020"/>
  <g transform="translate(1020 285)" filter="url(#shadow)">
    <rect width="235" height="178" rx="18" fill="#eef7ff" stroke="#2b83d3" stroke-width="3"/>
    <text x="117.5" y="60" text-anchor="middle" font-size="46">🔐</text>
    <text x="117.5" y="105" text-anchor="middle" class="box-title">OpenVPN 隧道</text>
    <text x="117.5" y="138" text-anchor="middle" class="box-text">绑定 tun / utun</text>
    <text x="117.5" y="166" text-anchor="middle" class="box-text">只让代理流量出隧道</text>
  </g>

  <path class="arrow" d="M1265 374 H1320"/>
  <g transform="translate(1320 285)" filter="url(#shadow)">
    <rect width="185" height="178" rx="18" fill="#e9fbf5" stroke="#13a37f" stroke-width="3"/>
    <text x="92.5" y="60" text-anchor="middle" font-size="46">🌐</text>
    <text x="92.5" y="105" text-anchor="middle" class="box-title">VPNGate 节点</text>
    <text x="92.5" y="138" text-anchor="middle" class="box-text">免费公共节点</text>
    <text x="92.5" y="166" text-anchor="middle" class="box-text">作为外网出口</text>
  </g>

  <path class="arrow" d="M1412 470 V575"/>
  <text x="1450" y="526" class="label">访问目标网站</text>
  <g transform="translate(1280 595)" filter="url(#shadow)">
    <rect width="245" height="126" rx="18" fill="#ffffff" stroke="#13a37f" stroke-width="3"/>
    <text x="122.5" y="50" text-anchor="middle" class="box-title">目标网站</text>
    <text x="122.5" y="84" text-anchor="middle" class="box-text">看到的是 VPNGate</text>
    <text x="122.5" y="112" text-anchor="middle" class="box-text">出口 IP</text>
  </g>

  <text x="768" y="602" text-anchor="middle" class="section">后台自动维护流程</text>
  <g filter="url(#shadow)">
    <g transform="translate(105 665)">
      <rect width="215" height="118" rx="16" fill="#ffffff" stroke="#2b83d3" stroke-width="3"/>
      <text x="107.5" y="48" text-anchor="middle" class="small-title">VPNGate API</text>
      <text x="107.5" y="82" text-anchor="middle" class="small-text">拉取节点列表</text>
    </g>
    <path class="arrow" d="M330 724 H415"/>
    <g transform="translate(415 665)">
      <rect width="205" height="118" rx="16" fill="#ffffff" stroke="#2b83d3" stroke-width="3"/>
      <text x="102.5" y="48" text-anchor="middle" class="small-title">节点池</text>
      <text x="102.5" y="82" text-anchor="middle" class="small-text">保存 .ovpn 配置</text>
    </g>
    <path class="arrow" d="M630 724 H715"/>
    <g transform="translate(715 665)">
      <rect width="215" height="118" rx="16" fill="#ffffff" stroke="#2b83d3" stroke-width="3"/>
      <text x="107.5" y="48" text-anchor="middle" class="small-title">并发测速</text>
      <text x="107.5" y="82" text-anchor="middle" class="small-text">Ping + 试拨 OpenVPN</text>
    </g>
    <path class="arrow" d="M940 724 H1025"/>
    <g transform="translate(1025 665)">
      <rect width="215" height="118" rx="16" fill="#ffffff" stroke="#2b83d3" stroke-width="3"/>
      <text x="107.5" y="48" text-anchor="middle" class="small-title">自动选择</text>
      <text x="107.5" y="82" text-anchor="middle" class="small-text">低延迟 / 可用节点</text>
    </g>
    <path class="arrow" d="M1250 724 H1325"/>
    <g transform="translate(1325 665)">
      <rect width="180" height="118" rx="16" fill="#ffffff" stroke="#2b83d3" stroke-width="3"/>
      <text x="90" y="48" text-anchor="middle" class="small-title">故障切换</text>
      <text x="90" y="82" text-anchor="middle" class="small-text">断线后换备用</text>
    </g>
  </g>

  <rect x="110" y="862" width="1316" height="82" rx="18" fill="#e9f6ff" stroke="#b8d8ec" stroke-width="2"/>
  <text x="768" y="895" text-anchor="middle" class="box-text">
    关键点：OpenVPN 不接管整台 VPS 默认路由；代理程序创建出站连接时绑定 VPN 虚拟网卡。
  </text>
  <text x="768" y="925" text-anchor="middle" class="box-text">
    所以，只有“使用本地代理端口”的流量才会走 VPNGate 节点出网。
  </text>
</svg>
