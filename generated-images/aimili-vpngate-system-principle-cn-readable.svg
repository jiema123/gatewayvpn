<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f7fbff"/>
      <stop offset="1" stop-color="#eefaf6"/>
    </linearGradient>
    <filter id="shadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="10" stdDeviation="10" flood-color="#13314f" flood-opacity=".13"/>
    </filter>
    <marker id="arrow" markerWidth="14" markerHeight="14" refX="11" refY="7" orient="auto">
      <path d="M2 2 L12 7 L2 12 Z" fill="#2c83d2"/>
    </marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", sans-serif; }
      .title { font-size: 58px; font-weight: 800; fill: #102d49; }
      .subtitle { font-size: 24px; fill: #61768b; }
      .box-title { font-size: 29px; font-weight: 760; fill: #102d49; }
      .box-desc { font-size: 21px; fill: #5d7184; }
      .small-title { font-size: 25px; font-weight: 760; fill: #102d49; }
      .small-desc { font-size: 19px; fill: #5d7184; }
      .arrow { stroke: #2c83d2; stroke-width: 7; fill: none; marker-end: url(#arrow); stroke-linecap: round; }
      .section { font-size: 32px; font-weight: 800; fill: #102d49; }
    </style>
  </defs>
  <rect width="1536" height="1024" fill="url(#bg)"/>
  <g opacity=".35" stroke="#c5ddec" stroke-width="1.5" fill="none">
    <path d="M70 85 L180 150 L295 60"/>
    <path d="M1280 70 L1400 150 L1505 70"/>
    <path d="M65 905 L205 820 L330 910"/>
    <circle cx="180" cy="150" r="8" fill="#57d38a" stroke="none"/>
    <circle cx="1400" cy="150" r="8" fill="#9bcdec" stroke="none"/>
  </g>

  <text x="768" y="88" text-anchor="middle" class="title">GateWayVPN 中文系统原理图</text>
  <text x="768" y="133" text-anchor="middle" class="subtitle">把 VPNGate 免费节点转换成 VPS 上的本地代理网关</text>

  <g filter="url(#shadow)">
    <g transform="translate(70 285)">
      <rect width="210" height="178" rx="20" fill="#e8f4ff" stroke="#2c83d2" stroke-width="3"/>
      <circle cx="105" cy="54" r="28" fill="#2c83d2"/>
      <rect x="82" y="88" width="46" height="30" rx="4" fill="#ffffff" stroke="#102d49" stroke-width="3"/>
      <line x1="95" y1="122" x2="115" y2="122" stroke="#102d49" stroke-width="4"/>
      <text x="105" y="142" text-anchor="middle" class="box-title">用户应用</text>
      <text x="105" y="168" text-anchor="middle" class="box-desc">浏览器 / 脚本</text>
    </g>
    <path class="arrow" d="M295 374 H365"/>

    <g transform="translate(365 285)">
      <rect width="240" height="178" rx="20" fill="#e9fbf5" stroke="#13a37f" stroke-width="3"/>
      <circle cx="120" cy="55" r="30" fill="#13a37f"/>
      <path d="M100 55 H140 M120 35 V75 M104 39 L136 71 M136 39 L104 71" stroke="#ffffff" stroke-width="6" stroke-linecap="round"/>
      <text x="120" y="122" text-anchor="middle" class="box-title">GateWayVPN 网关</text>
      <text x="120" y="150" text-anchor="middle" class="box-desc">Web 管理 + 后台守护</text>
    </g>
    <path class="arrow" d="M620 374 H685"/>

    <g transform="translate(685 285)">
      <rect width="240" height="178" rx="20" fill="#f5faff" stroke="#2c83d2" stroke-width="3"/>
      <circle cx="120" cy="55" r="30" fill="#2c83d2"/>
      <path d="M98 55 H142" stroke="#ffffff" stroke-width="8" stroke-linecap="round"/>
      <circle cx="99" cy="55" r="8" fill="#ffffff"/>
      <circle cx="142" cy="55" r="8" fill="#ffffff"/>
      <text x="120" y="122" text-anchor="middle" class="box-title">本地代理</text>
      <text x="120" y="150" text-anchor="middle" class="box-desc">HTTP / SOCKS5 :7928</text>
    </g>
    <path class="arrow" d="M940 374 H1010"/>

    <g transform="translate(1010 285)">
      <rect width="230" height="178" rx="20" fill="#eef7ff" stroke="#2c83d2" stroke-width="3"/>
      <circle cx="115" cy="55" r="30" fill="#2c83d2"/>
      <path d="M96 58 C105 38 130 38 140 58 L140 75 L96 75 Z" fill="none" stroke="#ffffff" stroke-width="6" stroke-linejoin="round"/>
      <text x="115" y="122" text-anchor="middle" class="box-title">VPN 隧道</text>
      <text x="115" y="150" text-anchor="middle" class="box-desc">绑定 tun / utun 网卡</text>
    </g>
    <path class="arrow" d="M1255 374 H1310"/>

    <g transform="translate(1310 285)">
      <rect width="205" height="178" rx="20" fill="#e9fbf5" stroke="#13a37f" stroke-width="3"/>
      <circle cx="102.5" cy="55" r="30" fill="#13a37f"/>
      <circle cx="102.5" cy="55" r="19" fill="none" stroke="#ffffff" stroke-width="5"/>
      <path d="M83 55 H122 M102 36 C92 48 92 62 102 74 M102 36 C113 48 113 62 102 74" stroke="#ffffff" stroke-width="4" fill="none"/>
      <text x="102.5" y="122" text-anchor="middle" class="box-title">VPNGate 节点</text>
      <text x="102.5" y="150" text-anchor="middle" class="box-desc">作为外网出口</text>
    </g>
  </g>

  <path class="arrow" d="M1413 470 V580"/>
  <g transform="translate(1287 602)" filter="url(#shadow)">
    <rect width="250" height="126" rx="20" fill="#ffffff" stroke="#13a37f" stroke-width="3"/>
    <rect x="58" y="30" width="134" height="76" rx="8" fill="#e8f4ff" stroke="#2c83d2" stroke-width="3"/>
    <line x1="78" y1="52" x2="172" y2="52" stroke="#13a37f" stroke-width="5"/>
    <line x1="78" y1="73" x2="155" y2="73" stroke="#9bb3c7" stroke-width="5"/>
    <text x="125" y="155" text-anchor="middle" class="box-title">目标网站</text>
  </g>

  <text x="768" y="608" text-anchor="middle" class="section">后台自动维护流程</text>
  <g filter="url(#shadow)">
    <g transform="translate(185 672)">
      <rect width="230" height="118" rx="18" fill="#ffffff" stroke="#2c83d2" stroke-width="3"/>
      <text x="115" y="48" text-anchor="middle" class="small-title">节点更新</text>
      <text x="115" y="82" text-anchor="middle" class="small-desc">拉取 VPNGate 列表</text>
    </g>
    <path class="arrow" d="M430 731 H540"/>
    <g transform="translate(540 672)">
      <rect width="230" height="118" rx="18" fill="#ffffff" stroke="#2c83d2" stroke-width="3"/>
      <text x="115" y="48" text-anchor="middle" class="small-title">并发测速</text>
      <text x="115" y="82" text-anchor="middle" class="small-desc">筛选可用节点</text>
    </g>
    <path class="arrow" d="M785 731 H895"/>
    <g transform="translate(895 672)">
      <rect width="230" height="118" rx="18" fill="#ffffff" stroke="#2c83d2" stroke-width="3"/>
      <text x="115" y="48" text-anchor="middle" class="small-title">自动切换</text>
      <text x="115" y="82" text-anchor="middle" class="small-desc">断线后换备用</text>
    </g>
    <path class="arrow" d="M1135 731 C1195 731 1210 625 1165 545 C1125 475 1010 475 965 520"/>
  </g>

  <rect x="110" y="862" width="1316" height="82" rx="18" fill="#e9f6ff" stroke="#b8d8ec" stroke-width="2"/>
  <text x="768" y="896" text-anchor="middle" class="box-desc">关键点：OpenVPN 不接管整台 VPS 默认路由；代理程序出站时绑定 VPN 虚拟网卡。</text>
  <text x="768" y="926" text-anchor="middle" class="box-desc">所以，只有“使用本地代理”的流量才会走 VPNGate 节点访问目标网站。</text>
</svg>
